
<h3>Create Event</h3>
<form  (submit)="createEvent()">
   <!-- <label class="hidden" for="id">ID:</label>
    <input class="hidden" type="number" id="id" value="id" [(ngModel)]="id" name="id" readonly>
   --> 
    <label for="title"> Title:</label>
    <input type="text" id="title" [(ngModel)]="title" name="title" required maxlength="32">

    <label for="description">Description:</label>
    <input type="text" id="description" [(ngModel)]="description" name="description" maxlength="500" required>

    <label for="date">Date:</label>
    <input type="date" id="date" [(ngModel)]="date" name="date" required>

    <label for="location">Location:</label>
    <input type="text" id="location" [(ngModel)]="location" name="location" required maxlength="80">

    <button type="submit" (click)="id = events.length">Create</button>
</form>
