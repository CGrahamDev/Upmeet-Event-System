
<div>
    
<form (submit)="createEvent()">
    <label for="userId"> User ID:</label>
    <input type="number" id="eventId" [(ngModel)]="userId" name="userId" required>
    
    <label for="title">Title:</label>
    <input type="=text" id="title" [(ngModel)]="title" name="title" required>
    
    <label for="description"> Description:</label>
    <input type="text" id="description" [(ngModel)]="description" name="description" required>
    
    <label for="date">Date:</label>
    <input type="date" id="date" [(ngModel)]="date" name="date" required>
    
    <label for="location"> Location:</label>
    <input type="text" id="location" [(ngModel)]="location" name="location" required>

   
    <button type="submit">Create Event</button>
</form>
</div>
