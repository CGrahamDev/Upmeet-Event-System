<h3>Create Event</h3>
<form (submit)="createEvent()">
    <label for="title"> Title:</label>
    <input type="string" id="title" [(ngModel)]="title" name="title" required>

    <label for="description">Description:</label>
    <input type="=string" id="description" [(ngModel)]="description" name="description" required>

    <label for="date">Date:</label>
    <input type="=string" id="date" [(ngModel)]="date" name="date" required>

    <label for="location">Location:</label>
    <input type="=string" id="location" [(ngModel)]="location" name="location" required>

    <button type="submit">Create</button>
</form>
