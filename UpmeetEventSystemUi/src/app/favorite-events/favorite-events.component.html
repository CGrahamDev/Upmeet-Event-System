<ul *ngFor="let favorite of favorites">
    <li>{{favorite.userId}}, {{favorite.eventId}}</li>
</ul>

<h3>Add to favorites</h3>
<form (submit)="addToFavorites()">
    <label for="eventId"> Event ID:</label>
    <input type="number" id="eventId" [(ngModel)]="eventId" name="eventId" required>

    <label for="userId">User ID:</label>
    <input type="=number" id="userId" [(ngModel)]="userId" name="userId" required>
    <button type="submit"> Add</button>
</form>

<h3>Remove from favorites</h3>
<form (submit)="removeFromFavorite()">
    <label for="favoriteId"> Favorite ID:</label>
    <input type="number" id="favoriteId" [(ngModel)]="favoriteId" name="favoriteId" required>

    <label for="userId">User ID:</label>
    <input type="=number" id="userId" [(ngModel)]="userId" name="userId" required>
    <button type="submit">Remove</button>
</form>
