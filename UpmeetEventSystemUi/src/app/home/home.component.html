<h1>Events For You</h1>
<hr>


<div Class="events" *ngFor="let event of events">
    <h2>{{event.title}}</h2>
   <!-- EVENT IMAGE MAYBE?-->
   <button type="button" class="collapsible"  (click)="event.isHidden=!event.isHidden" >see more</button>
   
   <form (submit)="addToFavorites()" [hidden]="!event.isHidden">
    <label for="userId"> User ID:</label>
    <input type="number" id="userId" [(ngModel)]="userId" name="userId" required>
    <input type="number" id="eventId" name="eventId" [(ngModel)]="event.Id" >Event ID:{{event.Id}}
    <button type="submit">Add to favorites</button> 
   </form>
   
   <div class="content" [hidden]="!event.isHidden">
        <p>{{event.description}}</p>
        <h3>{{event.date}},</h3>
        <h3>{{event.location}}</h3>
    </div>
</div>
