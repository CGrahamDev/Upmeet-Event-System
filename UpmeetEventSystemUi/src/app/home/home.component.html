<form class="inline-block">
    <label for="userId">User ID:</label>
    <input type="number" id="userId" [(ngModel)]="userId" name="userId" required>
    <button type="submit"> Add</button>
</form>
<h1>Events For You</h1>
<hr>



<div Class="events" *ngFor="let event of events" [(ngModel)]="event.id">
    <h2>{{event.title}}</h2>
    <h3>{{event.date | date: 'short'}}</h3>
    <!-- EVENT IMAGE MAYBE?-->
    <button type="button" (click)="event.isHidden=!event.isHidden">see more</button>

    <form class="favSubmit" (submit)="addToFavorites()" [hidden]="!event.isHidden">
        <label for="userId">User ID:</label>
        <input type="number" id="userId" value="userId" [(ngModel)]="userId" name="userId" readonly required>
        <label for="eventId"> Event ID:</label>
        <input type="number" value="{{event.id}}" id="eventId" [(ngModel)]="eventId" name="eventId" readonly>

        <button type="submit" (click)="eventId=event.id" >Add to favorites</button>
    </form>

    <div class="content" [hidden]="!event.isHidden">
        <p>{{event.description}}</p>

        <h3>{{event.location}}</h3>
    </div>
</div>
